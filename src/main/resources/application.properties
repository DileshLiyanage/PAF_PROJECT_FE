# Application
spring.application.name=paf-project

# H2 Database (development)
spring.datasource.url=jdbc:h2:mem:pafdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
# Secret key must be at least 256 bits (32 bytes) when Base64-encoded for HS256
# Set JWT_SECRET environment variable in production; the value below is a local dev default only
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Token expiration: 24 hours in milliseconds
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=8080
